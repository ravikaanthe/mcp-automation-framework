[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-automation-framework"
version = "2.0.0"
description = "Python + Playwright migration of the MCP automation framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.52.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-playwright>=0.4.0",
]

[project.scripts]
mcp-automation = "mcp_automation_framework.cli:main"

[tool.setuptools]
packages = ["mcp_automation_framework"]
